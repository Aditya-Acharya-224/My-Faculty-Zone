{% extends 'base.html' %}
{% block sidebar %}{% endblock %} {% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4 card shadow p-4">
        <h3 class="text-center mb-4">Login</h3>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <p class="mt-3 text-center">New user? <a href="{% url 'signup' %}">Sign up here</a></p>
    </div>
</div>
{% endblock %}
