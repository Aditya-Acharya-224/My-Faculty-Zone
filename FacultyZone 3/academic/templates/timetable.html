{% extends 'base.html' %}
{% block content %}
<div class="pt-3 pb-2 mb-3 border-bottom d-flex justify-content-between align-items-center">
    <h1 class="h2">My Timetable Grid</h1>
    <span class="text-muted">Click any cell to edit</span>
</div>

<div class="table-responsive">
    <table class="table table-bordered shadow-sm bg-white">
        <thead class="table-dark text-center">
            <tr>
                <th style="width: 120px;">Day / Period</th>
                {% for p in periods %} <th>P{{ p }}</th> {% endfor %}
            </tr>
        </thead>
        <tbody>
            {% for row in full_grid %}
            <tr>
                <td class="fw-bold bg-light text-center align-middle">{{ row.day_name }}</td>
                {% for cell in row.cells %}
                <td class="p-0" style="min-width: 100px; height: 70px;">
                    <div class="timetable-cell h-100 p-2 text-center d-flex align-items-center justify-content-center" 
                         contenteditable="true" 
                         data-cell-id="{{ cell.day }}-{{ cell.period }}"
                         style="outline: none; cursor: cell;">
                        {{ cell.content }}
                    </div>
                </td>
                {% endfor %}
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<script>
// Auto-save logic
document.querySelectorAll('.timetable-cell').forEach(cell => {
    cell.addEventListener('blur', function() {
        let cellId = this.getAttribute('data-cell-id');
        let text = this.innerText;

        let formData = new FormData();
        formData.append('cell_id', cellId);
        formData.append('content', text);
        formData.append('csrfmiddlewaretoken', '{{ csrf_token }}');

        fetch("{% url 'timetable' %}", {
            method: 'POST',
            body: formData
        }).then(response => {
            if(response.ok) {
                this.style.backgroundColor = "#e8f5e9"; // Flash green on save
                setTimeout(() => this.style.backgroundColor = "transparent", 500);
            }
        });
    });
});
</script>

<style>
    .timetable-cell:hover { background-color: #f8f9fa; }
    .timetable-cell:focus { background-color: #fff; box-shadow: inset 0 0 0 2px var(--fresh-sky); }
</style>
{% endblock %}
